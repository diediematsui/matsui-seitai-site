<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送信完了 | 松井整体院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17130f;
    --ink: #ece4d6;
    --ink-dim: #b7ab97;
    --amber: #d6a04f;
    --amber-dim: #9c793d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.9;
    letter-spacing:.02em;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:28px;
  }
  .wrap{max-width:480px;}
  .label{
    font-size:.72rem;
    letter-spacing:.28em;
    color:var(--amber);
    margin-bottom:18px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-size:clamp(1.5rem, 5vw, 2rem);
    margin-bottom:22px;
  }
  p{color:var(--ink-dim); font-size:.95rem; margin-bottom:36px;}
  a.back-link{
    display:inline-block;
    border:1px solid var(--amber-dim);
    color:var(--amber);
    text-decoration:none;
    padding:14px 40px;
    font-size:.9rem;
    letter-spacing:.06em;
    border-radius:2px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">THANK YOU</div>
    <h1 class="mincho">口コミを送信いただき<br>ありがとうございます</h1>
    <p>内容を確認のうえ、順次サイトに掲載させていただきます。掲載まで今しばらくお待ちください。</p>
    <a class="back-link" href="/index.html">トップページへ戻る</a>
  </div>
</body>
</html>

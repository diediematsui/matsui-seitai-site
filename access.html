<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>道順 | 松井整体院</title>
<meta name="description" content="富山市桜町、うーたん牧場の店内で施術しています。カラオケ・ジャンカラを目印に、路地の白いアーチをくぐって突き当たりが入口です。写真つきの順路でご案内します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17130f;
    --bg-2: #1f1a14;
    --panel: #251f18;
    --line: #3a3226;
    --ink: #ece4d6;
    --ink-dim: #b7ab97;
    --amber: #d6a04f;
    --amber-dim: #9c793d;
    --brick: #a3462c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.9;
    letter-spacing:.02em;
    -webkit-font-smoothing:antialiased;
  }
  .mincho{font-family:'Shippori Mincho', serif;}
  .wrap{max-width:920px; margin:0 auto; padding:0 28px;}

  .top-bar{padding:28px 0 0;}
  .back-link{font-size:.8rem; color:var(--ink-dim); text-decoration:none; letter-spacing:.05em;}
  .back-link:hover{color:var(--amber);}

  section{padding:64px 0;}
  .label{
    font-size:.72rem;
    letter-spacing:.28em;
    color:var(--amber);
    margin-bottom:18px;
  }
  h1.page-title{
    font-family:'Shippori Mincho', serif;
    font-size:clamp(1.7rem, 5vw, 2.4rem);
    font-weight:700;
    line-height:1.5;
    margin-bottom:18px;
  }
  p.body-text{color:var(--ink-dim); font-size:1rem; max-width:36em;}

  /* ROUTE STEPS */
  .route-step{
    margin-top:48px;
    padding-top:40px;
    border-top:1px solid var(--line);
  }
  .route-step:first-of-type{border-top:0; padding-top:0;}
  .route-num{
    font-family:'Shippori Mincho', serif;
    font-size:1.6rem;
    color:var(--amber-dim);
    margin-bottom:14px;
  }
  .route-step img{width:100%; height:auto; display:block; border:1px solid var(--line);}
  .route-step.is-portrait img{max-width:480px;}
  .route-step p{margin-top:18px; font-size:1rem; color:var(--ink);}

  /* MAP */
  .map-embed{
    margin-top:40px;
    max-width:480px;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
    background:#000;
  }
  .map-embed iframe{
    display:block;
    width:100%;
    height:320px;
    border:0;
    filter:grayscale(.15) contrast(1.05) brightness(.9);
  }

  .cta-section{text-align:center; padding:96px 0;}
  .cta-section h2{
    font-family:'Shippori Mincho', serif;
    font-size:clamp(1.5rem, 5vw, 2.2rem);
    margin-bottom:28px;
  }
  .line-btn{
    display:inline-block;
    background:var(--amber);
    color:#17130f;
    font-weight:700;
    padding:18px 52px;
    font-size:1.02rem;
    letter-spacing:.06em;
    text-decoration:none;
    border-radius:2px;
  }
  .line-btn:hover{background:#e2ac59;}

  footer{
    text-align:center;
    padding:36px 0 60px;
    font-size:.78rem;
    color:var(--ink-dim);
    opacity:.6;
  }
  footer a{color:var(--amber-dim); text-decoration:underline; opacity:1;}
  footer .footer-links{margin-top:10px;}

  @media(max-width:640px){
    section{padding:48px 0;}
    .map-embed{max-width:100%;}
    .map-embed iframe{height:240px;}
    .route-step.is-portrait img{max-width:100%;}
    .line-btn{display:block; text-align:center;}
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="wrap">
    <a class="back-link" href="/index.html">← 松井整体院トップへ</a>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="label">ACCESS</div>
    <h1 class="page-title mincho">道順</h1>
    <p class="body-text">富山市桜町、うーたん牧場の店内で施術しています。写真の順にお進みください。</p>

    <div class="route-step">
      <div class="route-num">1</div>
      <picture>
        <source type="image/webp" srcset="/images/access-01-street.webp">
        <img src="/images/access-01-street.webp" width="1400" height="1050" loading="lazy" decoding="async" alt="通り沿いに並ぶラーメン店とカラオケ店の外観。その間に白いアーチが見える">
      </picture>
      <p>カラオケ・ジャンカラが目印です。</p>
    </div>

    <div class="route-step is-portrait">
      <div class="route-num">2</div>
      <picture>
        <source type="image/webp" srcset="/images/access-02-gate.webp">
        <img src="/images/access-02-gate.webp" width="900" height="1200" loading="lazy" decoding="async" alt="路地の入口にある白いアーチと牛の像">
      </picture>
      <p>ジャンカラの手前、ラーメン支那銀との間の路地に入ると、白いアーチと牛の像があります。</p>
    </div>

    <div class="route-step">
      <div class="route-num">3</div>
      <picture>
        <source type="image/webp" srcset="/images/access-03-door.webp">
        <img src="/images/access-03-door.webp" width="1400" height="1050" loading="lazy" decoding="async" alt="路地の突き当たりにある入口の正面">
      </picture>
      <p>アーチをくぐって突き当たりが入口です。</p>
    </div>

    <div class="map-embed">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d467.40324510602517!2d137.2130356489906!3d36.69884615702307!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5ff791bc18cc661d%3A0x38beb5651510df!2z5p2-5LqV5pW05L2T6Zmi!5e0!3m2!1sja!2sjp!4v1788832058830!5m2!1sja!2sjp" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </div>
</section>

<section class="cta-section">
  <div class="wrap">
    <h2 class="mincho">ご予約はこちらから</h2>
    <a class="line-btn" href="https://lin.ee/ozaeHCLi" target="_blank" rel="noopener">公式LINEで予約する</a>
  </div>
</section>

<footer>
  松井整体院
  <div class="footer-links"><a href="/index.html">トップへ戻る</a> ／ <a href="/hip.html">股関節でお悩みの方へ</a> ／ <a href="/review-wall.html">お客様の声</a></div>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口コミを投稿する | 松井整体院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17130f;
    --bg-2: #1f1a14;
    --panel: #251f18;
    --line: #3a3226;
    --ink: #ece4d6;
    --ink-dim: #b7ab97;
    --amber: #d6a04f;
    --amber-dim: #9c793d;
    --brick: #a3462c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.9;
    letter-spacing:.02em;
    -webkit-font-smoothing:antialiased;
  }
  .mincho{font-family:'Shippori Mincho', serif;}
  .wrap{max-width:680px; margin:0 auto; padding:0 28px;}

  .top-bar{padding:28px 0 0;}
  .back-link{font-size:.8rem; color:var(--ink-dim); text-decoration:none; letter-spacing:.05em;}
  .back-link:hover{color:var(--amber);}

  section{padding:56px 0 96px;}
  .label{
    font-size:.72rem;
    letter-spacing:.28em;
    color:var(--amber);
    margin-bottom:18px;
  }
  h1.headline{
    font-family:'Shippori Mincho', serif;
    font-size:clamp(1.6rem, 5vw, 2.2rem);
    font-weight:700;
    line-height:1.6;
    margin-bottom:22px;
  }
  p.body-text{
    color:var(--ink-dim);
    font-size:.96rem;
    max-width:34em;
  }

  .note{
    margin-top:32px;
    padding:18px 22px;
    border-left:3px solid var(--brick);
    background:rgba(163,70,44,.08);
    font-size:.88rem;
    color:var(--ink-dim);
  }

  form{margin-top:44px; display:flex; flex-direction:column; gap:26px;}
  .field label{
    display:block;
    font-size:.78rem;
    color:var(--amber);
    letter-spacing:.08em;
    margin-bottom:10px;
  }
  .field .hint{font-size:.76rem; color:var(--ink-dim); margin-top:6px; opacity:.8;}
  .field input[type="text"],
  .field select,
  .field textarea{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:inherit;
    font-size:.95rem;
    padding:14px 16px;
    border-radius:2px;
  }
  .field textarea{resize:vertical; min-height:140px; line-height:1.8;}
  .field input:focus,
  .field select:focus,
  .field textarea:focus{outline:none; border-color:var(--amber-dim);}

  .hidden-field{position:absolute; left:-9999px; top:-9999px;}

  .form-error{
    padding:14px 18px;
    border-left:3px solid var(--brick);
    background:rgba(163,70,44,.1);
    font-size:.86rem;
    color:var(--ink-dim);
  }

  .submit-btn{
    display:inline-block;
    align-self:flex-start;
    background:var(--amber);
    color:#17130f;
    font-weight:700;
    padding:16px 48px;
    font-size:.98rem;
    letter-spacing:.06em;
    border:none;
    border-radius:2px;
    cursor:pointer;
  }
  .submit-btn:hover{background:#e2ac59;}

  footer{
    text-align:center;
    padding:36px 0 60px;
    font-size:.78rem;
    color:var(--ink-dim);
    opacity:.6;
  }
  footer a{color:var(--amber-dim); text-decoration:underline; opacity:1;}

  @media(max-width:640px){
    section{padding:40px 0 64px;}
    .submit-btn{width:100%; text-align:center;}
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="wrap">
    <a class="back-link" href="/index.html">← 松井整体院トップへ</a>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="label">REVIEW</div>
    <h1 class="headline">口コミを投稿する</h1>
    <p class="body-text">施術を受けてのご感想をお聞かせください。いただいた内容は今後お越しになる方の参考にさせていただきます。</p>

    <div class="note">
      いただいた口コミは自動では公開されません。内容を確認したうえで、順次サイトに手動で掲載させていただきます。掲載までお時間をいただく場合がありますので、あらかじめご了承ください。
    </div>

    <form id="review-form" name="review" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/review-thanks.html">
      <input type="hidden" name="form-name" value="review" />
      <p class="hidden-field">
        <label>入力しないでください<input name="bot-field" /></label>
      </p>

      <div class="field">
        <label for="name">お名前(ニックネーム可)<span aria-hidden="true">*</span></label>
        <input type="text" id="name" name="name" required maxlength="60">
      </div>

      <div class="field">
        <label for="rating">満足度<span aria-hidden="true">*</span></label>
        <select id="rating" name="rating" required>
          <option value="">選択してください</option>
          <option value="5">★★★★★(5)</option>
          <option value="4">★★★★☆(4)</option>
          <option value="3">★★★☆☆(3)</option>
          <option value="2">★★☆☆☆(2)</option>
          <option value="1">★☆☆☆☆(1)</option>
        </select>
      </div>

      <div class="field">
        <label for="menu">ご利用のメニュー(任意)</label>
        <input type="text" id="menu" name="menu" maxlength="60" placeholder="例:全身整体、骨盤矯正 など">
      </div>

      <div class="field">
        <label for="comment">口コミ内容<span aria-hidden="true">*</span></label>
        <textarea id="comment" name="comment" required maxlength="1000"></textarea>
        <div class="hint">サイトに掲載する際、内容の一部を編集させていただく場合があります。</div>
      </div>

      <p class="form-error" id="form-error" hidden data-default="送信に失敗しました。お手数ですが、時間をおいて再度お試しください。">送信に失敗しました。お手数ですが、時間をおいて再度お試しください。</p>

      <button class="submit-btn" type="submit">口コミを送信する</button>
    </form>
  </div>
</section>

<footer>
  <a href="/index.html">松井整体院トップへ戻る</a>
</footer>

<script>
  (function(){
    var form = document.getElementById('review-form');
    var errorMsg = document.getElementById('form-error');
    if(!form) return;
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if(errorMsg) errorMsg.hidden = true;
      var body = new URLSearchParams(new FormData(form)).toString();
      fetch(window.location.pathname, {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: body
      }).then(function(res){
        if(!res.ok){
          var err = new Error('submit failed');
          err.status = res.status;
          throw err;
        }
        window.location.href = '/review-thanks.html';
      }).catch(function(err){
        if(!errorMsg) return;
        var detail = err && err.status ? '(エラーコード: ' + err.status + ')' : '(ネットワークエラー)';
        errorMsg.textContent = errorMsg.getAttribute('data-default') + detail;
        errorMsg.hidden = false;
      });
    });
  })();
</script>

</body>
</html>
